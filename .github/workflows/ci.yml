name: Sign and release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  sign:
    name: Sign UPM package
    runs-on: ubuntu-latest
    env:
      UPM_SERVICE_ACCOUNT_KEY_ID: ${{ secrets.UPM_SERVICE_ACCOUNT_KEY_ID }}
      UPM_SERVICE_ACCOUNT_KEY_SECRET: ${{ secrets.UPM_SERVICE_ACCOUNT_KEY_SECRET }}
      UPM_ORG_ID: ${{ secrets.UPM_ORG_ID }}
      DIST_DIR: /tmp/signed-upm-dist
      PACKAGE_PATH: UnityProject/Packages/com.laicasaane.bakingsheet

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Read package metadata
        run: |
          package_name="$(jq -r '.name' $PACKAGE_PATH/package.json)"
          package_version="$(jq -r '.version' $PACKAGE_PATH/package.json)"

          echo "PACKAGE_NAME=$package_name" >> "$GITHUB_ENV"
          echo "PACKAGE_VERSION=$package_version" >> "$GITHUB_ENV"

          printf 'Package name: %s\n' "$package_name"
          printf 'Package version: %s\n' "$package_version"

      - name: Install Unity UPM CLI
        run: |
          curl -fsSL https://cdn.packages.unity.com/upm-cli/install.sh -o install.sh
          bash install.sh
          echo "$HOME/.upm/bin" >> "$GITHUB_PATH"

      - name: Verify Unity UPM CLI
        run: upm --help

      - name: Copy CHANGELOG, LICENSE, README into package
        run: |
          repository_version_url="https://github.com/laicasaane/BakingSheet/blob/$PACKAGE_VERSION"

          if [ -f CHANGELOG.md ]; then
            cp CHANGELOG.md "$PACKAGE_PATH/CHANGELOG.md"
          fi
          if [ -f LICENSE.md ]; then
            cp LICENSE.md "$PACKAGE_PATH/LICENSE.md"
          fi
          if [ -f LICENSE.Original.md ]; then
            cp LICENSE.Original.md "$PACKAGE_PATH/LICENSE.Original.md"
          fi
          if [ -f README.md ]; then
            cp README.md "$PACKAGE_PATH/README.md"
          fi

          for package_document in "$PACKAGE_PATH/CHANGELOG.md" "$PACKAGE_PATH/README.md"; do
            if [ -f "$package_document" ]; then
              sed -E -i "s#(\]\(|\]:[[:space:]]*)(\./)?(docs/|\.github/images/)#\1$repository_version_url/\3#g" "$package_document"
            fi
          done

      - name: Extract release notes
        shell: bash
        run: |
          notes_file="$RUNNER_TEMP/release-notes.md"

          # Always create the file expected by the release action.
          : > "$notes_file"

          if [ ! -f CHANGELOG.md ]; then
            echo "::warning::CHANGELOG.md was not found; release notes will be empty."
            exit 0
          fi

          if ! awk -v version="$PACKAGE_VERSION" '
            {
              line = $0
              sub(/\r$/, "", line)
            }
            line == "## " version {
              found = 1
              next
            }
            found && line ~ /^## / {
              exit
            }
            found {
              print line
            }
            END {
              if (!found) {
                exit 1
              }
            }
          ' CHANGELOG.md > "$notes_file"
          then
            : > "$notes_file"
            echo "::warning::No CHANGELOG.md section found for $PACKAGE_VERSION; release notes will be empty."
          fi

      - name: Sign package
        run: |
          mkdir -p "$DIST_DIR"
          upm pack ./$PACKAGE_PATH --organization-id "$UPM_ORG_ID" --destination "$DIST_DIR"

      - name: Print signed package info
        run: |
          shopt -s nullglob
          archives=("$DIST_DIR"/*.tgz "$DIST_DIR"/*.tar.gz)

          if [ "${#archives[@]}" -ne 1 ]; then
            printf 'Expected exactly one signed package archive, found %s\n' "${#archives[@]}" >&2
            exit 1
          fi

          archive="${archives[0]}"
          tar -tzf "$archive" | grep -qx 'package/package.json'
          tar -tzf "$archive" | grep -qx 'package/.attestation.p7m'

          echo "PACKAGE_ARCHIVE=$archive" >> "$GITHUB_ENV"
          printf 'Archive: %s\n' "$(basename "$archive")"
          tar -xOzf "$archive" package/package.json | jq '{name, version}'

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: ${{ runner.temp }}/release-notes.md
          prerelease: ${{ contains(env.PACKAGE_VERSION, '-') }}
          files: |
            /tmp/signed-upm-dist/*.tgz
            /tmp/signed-upm-dist/*.tar.gz
